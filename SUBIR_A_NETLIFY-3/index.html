<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1c3d">
<title>HNE · Limpieza</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Limpieza HNE">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#0e1c3d; --navy2:#172a54; --gold:#c8a962; --gold2:#e6d5a8;
  --bg:#eef2f8; --card:#ffffff; --line:#dde4ef; --ink:#0f1a2c; --muted:#6b7890;
  --ok:#15803d; --okbg:#e8f7ee; --warn:#b45309; --warnbg:#fff4e2;
  --bad:#b91c1c; --badbg:#fdecec; --doing:#b9760b; --doingbg:#fff6e6;
  --blue:#1d4ed8; --bluebg:#eaf0ff; --violet:#6d28d9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700}
a{color:var(--navy)}
.hide{display:none!important}

/* ---------- top bar ---------- */
.topbar{
  background:linear-gradient(135deg,#0b1733 0%,#16264f 55%,#1d3163 100%);
  color:#fff; padding:11px 13px 10px; position:sticky; top:0; z-index:40;
  border-bottom:2px solid var(--gold);
  box-shadow:0 3px 14px rgba(10,20,45,.18);
}
.topbar .row{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto}
.logo{width:38px;height:38px;border:1.5px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--gold);font-size:15px;letter-spacing:.5px;flex:0 0 auto;background:rgba(200,169,98,.08)}
.brand{flex:1;min-width:0}
.brand .h{font-size:14.5px;letter-spacing:.3px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .s{font-size:10.5px;color:#b9c4dc;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px}
.chip-date{background:rgba(255,255,255,.09);border:1px solid rgba(200,169,98,.45);color:#f0e6c8;
  padding:5px 9px;border-radius:20px;font-size:11.5px;white-space:nowrap}
.icobtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;width:36px;height:36px;
  border-radius:10px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.icobtn:active{background:rgba(255,255,255,.22)}
@media (max-width:430px){
  .tab{font-size:11.5px;padding:6px 2px}
  .tab .zh{font-size:8.5px}
  .tab .n{top:-6px;right:-6px;font-size:9px;padding:0 4px}
  .topbar .row{gap:8px}
  .topbar{padding:10px 11px 9px}
  .logo{width:34px;height:34px;font-size:13.5px}
  .brand .h{font-size:13px}
  .brand .s{font-size:9.5px;letter-spacing:.6px}
  .tb-right{gap:5px}
  .icobtn{width:33px;height:33px;font-size:14px;border-radius:9px}
  .topbar .langtog button{padding:2px 5px;font-size:10.5px}
}

.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 40px}
.wrap.narrow{max-width:600px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:5px;padding:9px 12px 0;max-width:1180px;margin:0 auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:#fff;color:#43506a;border-radius:11px;padding:7px 4px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;line-height:1.15;
  white-space:nowrap;cursor:pointer;font-weight:700;flex:1 1 0;min-width:0;text-align:center;overflow:hidden}
.tab .zh{font-size:9.5px;font-weight:600;opacity:.72;margin-top:1px;letter-spacing:.2px}
.tab.on .zh{opacity:.85;color:#e6d5a8}
.tab{position:relative}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(14,28,61,.25)}
.tab .n{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:1.5px solid #fff;font-size:0;padding:0;overflow:hidden;display:block}
.tab.on .n{background:var(--gold);color:#0e1c3d}
@media (max-width:440px){.tab{font-size:10.8px;padding:11px 1px 6px;letter-spacing:-.1px}.tab .zh{font-size:8.2px;letter-spacing:0}.tab .n{top:2px;right:3px}}

/* si Netlify pone su placa abajo a la derecha, subimos lo nuestro para que no tape el SOS */
body.nlbadge .sosfab{bottom:calc(var(--badge-h,64px) + 30px)}
body.nlbadge .toast{bottom:calc(var(--badge-h,64px) + 34px)}
body.nlbadge .wrap{padding-bottom:calc(var(--badge-h,64px) + 54px)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(16,28,54,.05)}
.card.tight{padding:11px 12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h3{font-size:15px;letter-spacing:.2px}
.card-h .sub{font-size:12px;color:var(--muted)}
.gold{color:var(--gold)}
.sec-title{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:20px 2px 9px;font-weight:700}
.sec-title b{color:var(--navy)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 14px;font-weight:650;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14.5px;
  transition:transform .06s ease, box-shadow .15s ease}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(180deg,#1b3260,#0e1c3d);border-color:#0e1c3d;color:#fff;box-shadow:0 3px 10px rgba(14,28,61,.22)}
.btn-gold{background:linear-gradient(180deg,#d9bc78,#c8a962);border-color:#b99a51;color:#2a1f08;box-shadow:0 3px 10px rgba(200,169,98,.35)}
.btn-ok{background:linear-gradient(180deg,#1a9a4d,#137a3c);border-color:#0f6631;color:#fff;box-shadow:0 3px 10px rgba(19,122,60,.25)}
.btn-danger{background:#fff;border-color:#f0c6c6;color:var(--bad)}
.btn-ghost{background:#f7f9fc}
.btn-lg{width:100%;padding:16px;font-size:17px;border-radius:13px;font-weight:800;letter-spacing:.3px}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- inputs ---------- */
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fbfcfe;outline:none}
.inp:focus{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(23,42,84,.08)}
label.lb{display:block;font-size:12px;color:var(--muted);font-weight:650;margin:10px 0 5px;letter-spacing:.3px}
textarea.inp{min-height:76px;resize:vertical}

/* ---------- login ---------- */
.login-hero{background:linear-gradient(150deg,#0b1733,#1b3160 70%,#24406f);border:1px solid rgba(200,169,98,.5);
  border-radius:18px;padding:26px 20px 22px;color:#fff;text-align:center;margin:18px 0 16px;position:relative;overflow:hidden}
.login-hero:after{content:"";position:absolute;top:8px;left:8px;right:8px;bottom:8px;inset:8px;border:1px solid rgba(200,169,98,.28);border-radius:12px;pointer-events:none}
.login-hero .k{font-size:10.5px;letter-spacing:3px;color:var(--gold2);text-transform:uppercase}
.login-hero h1{font-size:23px;margin:8px 0 4px;letter-spacing:.4px}
.login-hero .p{font-size:12.5px;color:#b9c4dc;letter-spacing:1.4px;text-transform:uppercase}
.user-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.user-pick{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 10px;text-align:center;cursor:pointer}
.user-pick .av{width:38px;height:38px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:15px}
.user-pick .nm{font-size:14.5px;font-weight:700}
.user-pick .rl{font-size:11px;color:var(--muted)}
.user-pick.on{border-color:var(--gold);background:#fffdf6;box-shadow:0 0 0 3px rgba(200,169,98,.16)}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:16px 0 6px}
.pin-dot{width:15px;height:15px;border-radius:50%;border:1.5px solid #c3cddd;background:#fff}
.pin-dot.f{background:var(--navy);border-color:var(--navy)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.key{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 0;font-size:21px;font-weight:700;cursor:pointer;
  box-shadow:0 1px 2px rgba(16,28,54,.05)}
.key:active{background:#eef2f8}

/* ---------- cleaner room cards ---------- */
.floor-h{display:flex;align-items:center;gap:10px;margin:16px 0 9px}
.floor-h .f{font-size:13px;font-weight:800;background:var(--navy);color:#fff;padding:4px 10px;border-radius:8px;letter-spacing:.6px}
.floor-h .l{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

.rc{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;
  box-shadow:0 1px 3px rgba(16,28,54,.06)}
.rc .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:#c9d3e3}
.rc.doing .bar{background:#e0a020}
.rc.done .bar{background:#159a4c}
.rc.pending .bar{background:#7b8aa5}
.rc.locked .bar{background:#8b5cf6}
.rc-body{padding:13px 13px 13px 16px}
.rc-top{display:flex;align-items:flex-start;gap:10px}
.rno{font-size:24px;font-weight:800;letter-spacing:.4px;line-height:1.05}
.rtype{font-size:11.5px;color:var(--muted);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:750;border-radius:6px;padding:3px 7px;
  letter-spacing:.4px;white-space:nowrap}
.b-co{background:var(--bluebg);color:var(--blue)}
.b-x{background:var(--warnbg);color:var(--warn)}
.b-v{background:#f1f4f9;color:#7b8aa5}
.b-done{background:var(--okbg);color:var(--ok)}
.b-doing{background:var(--doingbg);color:var(--doing)}
.b-late{background:var(--badbg);color:var(--bad)}
.b-ok{background:var(--okbg);color:var(--ok)}
.rc-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;font-size:12.5px;color:#3e4c66}
.rc-meta .it{display:flex;align-items:center;gap:4px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;color:var(--doing);letter-spacing:.5px}
.timer.big{font-size:26px}
.done-line{display:flex;align-items:center;gap:8px;background:var(--okbg);border-radius:9px;padding:9px 11px;margin-top:9px;
  font-size:13.5px;color:#14532d;font-weight:650}
.play-line{background:var(--doingbg);border-radius:9px;padding:9px 11px;margin-top:9px;font-size:13px;color:#7c4a06;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.obs-box{margin-top:9px;background:#fbfcfe;border:1px dashed #d7dfec;border-radius:9px;padding:9px 10px;font-size:13px;color:#384766}
.obs-box .k{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi .v{font-size:19px;font-weight:800;letter-spacing:.2px}
.kpi .l{font-size:9.5px;line-height:1.25;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:650}

/* ---------- admin cleaner card ---------- */
.ac{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.ac-h{display:flex;align-items:center;gap:10px}
.av2{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:0 0 auto}
.ac-nm{flex:1;min-width:0}
.ac-nm .n{font-weight:750;font-size:15.5px}
.ac-nm .s{font-size:11.5px;color:var(--muted)}
.prog{height:8px;background:#eef1f7;border-radius:99px;margin:11px 0 7px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#1a9a4d,#3ecf7c);border-radius:99px;transition:width .4s}
.ac-stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#41506b}
.ac-stats b{color:var(--ink);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.dot.idle{background:#f59e0b}
.dot.off{background:#c3ccdb}

/* ---------- room grid (admin) ---------- */
.grid-floors{display:flex;flex-direction:column;gap:10px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px}
.rchip{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 6px;text-align:center;cursor:pointer;
  font-variant-numeric:tabular-nums;position:relative}
.rchip .n{font-weight:800;font-size:14px;letter-spacing:.2px}
.rchip .t{font-size:9px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip .n{font-size:15px}
.rchip .as{font-size:9.5px;font-weight:700;margin-top:2px;color:var(--navy)}
.rchip.co{background:#eaf0ff;border-color:#b9caf7}
.rchip.x{background:#fff6e6;border-color:#f0d5a6}
.rchip.v{background:#f7f9fc;color:#94a1b7}
.rchip.ooo{background:#3c4658;border-color:#2b3344;color:#fff}
.rchip.ooo .t,.rchip.ooo .as{color:#cfd7e5}
.rchip.done{box-shadow:inset 0 0 0 2px #159a4c}
.rchip.doing{box-shadow:inset 0 0 0 2px #e0a020}

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:#4a5872;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
table.tt td{padding:8px 6px;font-size:12.5px}
table.tt th{padding:7px 6px;font-size:10px}
table.tt{min-width:0}
th{background:#f4f7fc;text-align:left;padding:9px 10px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:#586a86;
  border-bottom:1px solid var(--line);white-space:nowrap;font-weight:750}
td{padding:9px 10px;border-bottom:1px solid #eef2f8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.rowdoing td{background:#fffaf0}
tr.rowdone td{background:#f6fdf8}
.mono{font-variant-numeric:tabular-nums}

/* modal */
.mask{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;background:rgba(9,17,35,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;
  padding:0;backdrop-filter:blur(2px)}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;
  padding:16px 16px 26px;animation:up .18s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;position:sticky;top:-16px;
  background:#fff;padding:6px 0 8px;z-index:2}
.sheet-h h3{font-size:17px}
.sheet-h .x{background:#f2f5fa;border:none;width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;color:#3e4c66;flex:0 0 auto}
@media(min-width:720px){.mask{align-items:center;padding:20px}.sheet{border-radius:18px;max-height:88vh}}
@media(min-width:760px){
  .tab{flex:0 0 auto;flex-direction:row;gap:6px;padding:9px 15px;font-size:13.5px}
  .tab .zh{margin-top:0}
  td,th{white-space:nowrap}
}
@media(max-width:559px){
  .col-sm{display:none!important}
  table{min-width:0!important;font-size:12px}
  td,th{padding:8px 5px}
  .btn-sm{padding:6px 8px;font-size:12px}
}
@media(min-width:600px){ .only-sm{display:none!important} }

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#12203c;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:14px;font-weight:650;z-index:200;opacity:0;pointer-events:none;
  transition:.25s;border:1px solid rgba(200,169,98,.45);max-width:88vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sticky-bar{position:sticky;top:70px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(16,28,54,.07)}
.sticky-bar .g{flex:1;min-width:0}
.sticky-bar .g .t{font-size:13px;font-weight:750}
.sticky-bar .g .s{font-size:11.5px;color:var(--muted)}

.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:14px}
.empty .ic{font-size:34px;margin-bottom:8px;opacity:.5}
.note{background:#fffdf4;border:1px solid #ecdfb8;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#6b5a25}
.danger-note{background:var(--badbg);border:1px solid #f3c9c9;color:#8c1c1c;border-radius:10px;padding:10px 12px;font-size:12.5px}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:#cfd8e6;border:none;cursor:pointer;flex:0 0 auto;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:#159a4c}
.sw.on:after{left:22px}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eef2f8}
.list-row:last-child{border-bottom:none}
.list-row .g{flex:1;min-width:0}
.list-row .g .t{font-weight:700;font-size:14px}
.list-row .g .s{font-size:11.5px;color:var(--muted)}
.langtog{display:flex;border:1px solid rgba(200,169,98,.5);border-radius:9px;overflow:hidden}
.langtog button{background:transparent;border:none;color:#cfd8ea;padding:6px 8px;font-size:11px;cursor:pointer;font-weight:700}
.langtog button.on{background:var(--gold);color:#2a1f08}
.bell{position:relative}
.bell .nb{position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;border-radius:9px;font-size:9px;
  min-width:15px;height:15px;line-height:15px;text-align:center;border:1.5px solid #16264f;padding:0 3px}
.nitem{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;background:#fff}
.nitem.unread{background:#fffdf5;border-color:#e6d5a8}
.nitem .nt{font-size:11px;color:#8b96ab;display:flex;justify-content:space-between;margin-top:4px}
.nitem .tx{font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.pill{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#f1f4f9;color:#4a5872}

/* ---------- mensajes / SOS / horas ---------- */
.tabs{overflow-x:auto}
.chatlist .rowc{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chatlist .rowc:last-child{border-bottom:none}

<script>
/* ============================================================
   HNE LIMPIEZA · app de limpieza Hotel Nueva Europa
   ============================================================ */
const LSKEY='hne_limpieza_v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const hhmm=ts=>{if(!ts)return '—';const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const seghm=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+'h ':'')+pad(m)+'m'+(h?'':' '+pad(s)+'s')};
const mins=ms=>Math.max(0,Math.round(ms/60000));
const durTxt=ms=>{const m=Math.round(ms/60000); if(m<1) return '<1 min'; if(m<60) return m+' min';
  return Math.floor(m/60)+'h '+pad(m%60)+'m'};
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const fechaLarga=k=>{const d=parseKey(k);return DOW[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear()};
const MSH=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fechaCorta=k=>{const d=parseKey(k);return DOW[d.getDay()]+' '+d.getDate()+' '+MSH[d.getMonth()]};
const uid=p=>(p||'id')+'_'+Math.random().toString(36).slice(2,9);
const T=(es,zh)=>(UI&&UI.lang==='zh')?zh:es;

/* ---------------- habitaciones (70) ---------------- */
const TYPES={
  DOBLE:{es:'Habitación Doble',zh:'双人房',s:'DOBLE'},
  DELUX:{es:'Doble Delux',zh:'豪华双人房',s:'DLX'},
  TWIN:{es:'2 Camas Individuales',zh:'双床房',s:'2 CAMAS'},
  SUITE2:{es:'Suite · 2 camas',zh:'套房双床',s:'SUITE2'},
  SUITE1:{es:'Suite · 1 cama',zh:'套房大床',s:'SUITE1'},
  SUITER:{es:'Suite con Terraza',zh:'露台套房',s:'TERR'},
  BALCON:{es:'Doble con Balcón',zh:'阳台双人房',s:'BALCÓN'}
};
function buildRooms(){
  const r=[]; const add=(no,t,f)=>r.push({no:String(no),floor:f,type:t});
  for(let i=1;i<=10;i++) add(8100+i, i===2?'DELUX':'DOBLE', 1);
  add(8111,'SUITE2',1);
  for(let i=12;i<=19;i++) add(8100+i,'TWIN',1);
  for(let i=20;i<=25;i++) add(8100+i,'DOBLE',1);
  for(let i=1;i<=10;i++) add(8200+i, i===2?'DELUX':'DOBLE', 2);
  add(8211,'SUITE2',2);
  for(let i=12;i<=19;i++) add(8200+i,'TWIN',2);
  for(let i=20;i<=25;i++) add(8200+i,'DOBLE',2);
  for(let i=1;i<=5;i++) add(8300+i,'BALCON',3);
  for(let i=6;i<=10;i++) add(8300+i,'DOBLE',3);
  for(let i=11;i<=15;i++) add(8300+i,'TWIN',3);
  add(8316,'SUITE1',3); add(8317,'SUITER',3);
  for(let i=18;i<=20;i++) add(8300+i,'BALCON',3);
  return r.sort((a,b)=>a.no.localeCompare(b.no));
}
const ROOMS=buildRooms();
const ROOMMAP={}; ROOMS.forEach(r=>ROOMMAP[r.no]=r);

/* ---------------- estado inicial ---------------- */
const COLORS=['#1f4bd8','#0e7c66','#8a5a1a','#7c2d8f','#b0453a'];
function freshCfg(){
  return {
    hotel:'HOTEL NUEVA EUROPA',
    workStart:'08:00', workEnd:'18:00',
    adminPin:'9999',
    idleWarn:20, idleBad:40,
    cleaners:[
      {id:'c1', name:'陈', alias:'Chen', login:'chen', pin:'1111', floors:[1], factor:1, color:COLORS[0], active:true, u:1},
      {id:'c2', name:'曹', alias:'Cao', login:'cao', pin:'2222', floors:[2], factor:1, color:COLORS[1], active:true, u:1},
      {id:'c3', name:'石', alias:'Shi', login:'shi', pin:'3333', floors:[1,2], factor:1, color:COLORS[2], active:true, u:1},
      {id:'c4', name:'亚', alias:'Ya', login:'ya', pin:'4444', floors:[1,2,3], factor:1, color:COLORS[3], active:true, u:1},
      {id:'c5', name:'Liquan', alias:'Siya', login:'liquan', pin:'5555', floors:[3], factor:0.5, color:COLORS[4], active:true, u:1}
    ],
    zones:[
      {id:'z1', name:'早餐店 · 拖地扫地', es:'Desayunos: barrer y fregar', owner:'c2', u:1},
      {id:'z2', name:'外面楼梯 · 扫地拖地', es:'Escaleras exteriores', owner:'c5', u:1},
      {id:'z3', name:'早餐店 · 洗碗', es:'Desayunos: lavar platos', owner:'c5', u:1},
      {id:'z4', name:'酒店电梯 · 楼梯', es:'Ascensor y escaleras hotel', owner:'c3', u:1},
      {id:'z5', name:'前台大厅 · 厕所', es:'Aseos del hall', owner:'c1', u:1},
      {id:'z6', name:'宿舍门', es:'Puerta del dormitorio', owner:'c1', u:1}
    ],
    extras:[
      {id:'e1', name:'车库', es:'Garaje', pts:2, u:1},
      {id:'e2', name:'宿舍走廊', es:'Pasillo del dormitorio', pts:2, u:1},
      {id:'e3', name:'晒衣服大棚', es:'Nave de tender ropa', pts:2, u:1}
    ],
    cloud:{url:'',key:''}
  };
}
function freshState(){
  return {v:1, cfg:freshCfg(), cfgU:Date.now(), days:{}, att:{}, session:null, points:{}, notices:[], msgs:[], sos:[]};
}
let S=load();
function load(){
  try{
    const raw=localStorage.getItem(LSKEY);
    if(!raw) return freshState();
    const s=JSON.parse(raw);
    const base=freshState();
    s.cfg=Object.assign(base.cfg, s.cfg||{});
    s.cfg.cleaners=s.cfg.cleaners||base.cfg.cleaners;
    s.cfg.zones=s.cfg.zones||base.cfg.zones;
    s.cfg.extras=s.cfg.extras||base.cfg.extras;
    s.days=s.days||{}; s.att=s.att||{}; s.points=s.points||{}; s.notices=s.notices||[]; s.msgs=s.msgs||[]; s.sos=s.sos||[];
    return s;
  }catch(e){ return freshState(); }
}
let saveTimer=null;
function prune(){
  const lim=Date.now()-3*86400000;
  const keys=Object.keys(S.days).sort();
  // fotos solo de los últimos 3 días (para que el móvil y la nube no se llenen)
  keys.forEach(k=>{
    const d=S.days[k];
    if(parseKey(k).getTime()<lim){
      Object.values(d.tasks||{}).forEach(t=>{ if(t.photos&&t.photos.length) t.photos=[]; });
      Object.values(d.zones||{}).forEach(t=>{ if(t.photos&&t.photos.length) t.photos=[]; });
    }
  });
  if(keys.length>400){ keys.slice(0,keys.length-400).forEach(k=>delete S.days[k]); }
}
function save(){
  prune();
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){ console.warn('storage full',e); }
  if(cloud.on&&!cloud.pushMerging){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>cloudPush(),700); }
}

/* ---------------- utilidades de dominio ---------------- */
const TODAY=()=>dkey(new Date());
function cleaner(id){ return S.cfg.cleaners.find(c=>c.id===id) }
function weight(st){ return st==='CO'?1: st==='X'?0.5: 0 }
function ensureDay(k){
  if(!S.days[k]){
    S.days[k]={date:k,status:{},assign:{},rest:[],published:false,cfgU:0,tasks:{},zones:{},extras:{},events:[],note:'',checks:{}};
    ROOMS.forEach(r=>S.days[k].status[r.no]='V');
  }
  return S.days[k];
}
function dayOrNull(k){ return S.days[k]||null }
function myRooms(day,cid){
  if(!day) return [];
  return ROOMS.filter(r=>day.assign[r.no]===cid && ['CO','X'].includes(day.status[r.no]));
}
function taskOf(day,no){
  if(!day.tasks[no]) day.tasks[no]={assignee:day.assign[no]||null,status:'pending',rounds:[],obs:'',photos:[],check:null,u:Date.now()};
  return day.tasks[no];
}
function logEv(day,cid,type,ref,txt){
  day.events.push({t:Date.now(),cid,type,ref:ref||'',txt:txt||''});
  if(day.events.length>1200) day.events.splice(0,day.events.length-1200);
}
function attOf(k,cid){
  if(!S.att[k]) S.att[k]={};
  if(!S.att[k][cid]) S.att[k][cid]={in:null,out:null,u:Date.now()};
  return S.att[k][cid];
}
function lateMinutes(k,cid){
  const a=attOf(k,cid); if(!a.in) return 0;
  const [h,m]=S.cfg.workStart.split(':').map(Number);
  const start=parseKey(k); start.setHours(h,m,0,0);
  return Math.max(0, Math.round((a.in-start.getTime())/60000));
}
function currentTimer(day,cid){
  // cual es la tarea con el cronómetro corriendo
  for(const no in day.tasks){ const t=day.tasks[no];
    if(t.assignee===cid && t.status==='doing'){ const r=t.rounds[t.rounds.length-1]; if(r&&!r.end) return {kind:'room',key:no,r}; } }
  for(const z in day.zones){ const t=day.zones[z];
    if(t.assignee===cid && t.status==='doing'){ const r=t.rounds[t.rounds.length-1]; if(r&&!r.end) return {kind:'zone',key:z,r}; } }
  for(const e in day.extras){ const t=day.extras[e];
    if(t.assignee===cid && t.status==='doing'){ const r=t.rounds[t.rounds.length-1]; if(r&&!r.end) return {kind:'extra',key:e,r}; } }
  return null;
}
function lastEvent(day,cid){
  let last=null;
  (day.events||[]).forEach(e=>{ if(e.cid===cid) last=e.t; });
  return last;
}

/* ---------------- reparto automático ---------------- */
function activeCleaners(day){
  return S.cfg.cleaners.filter(c=>c.active && !((day.rest||[]).includes(c.id)));
}
function autoAssign(k){
  const day=ensureDay(k);
  const active=activeCleaners(day);
  const rooms=ROOMS.filter(r=>['CO','X'].includes(day.status[r.no]));
  const target={}, load={}, count={};
  const W=rooms.reduce((s,r)=>s+weight(day.status[r.no]),0);
  const F=active.reduce((s,c)=>s+(c.factor||1),0)||1;
  active.forEach(c=>{ target[c.id]=W*(c.factor||1)/F; load[c.id]=0; count[c.id]=0; });
  const assign={};
  if(!active.length){ day.assign={}; return {W,active,load,count}; }

  const sorted=rooms.slice().sort((a,b)=>a.floor-b.floor || a.no.localeCompare(b.no));
  sorted.forEach(r=>{
    const w=weight(day.status[r.no]);
    let pool=active.filter(c=>load[c.id]+w<=target[c.id]+0.5001);
    if(!pool.length) pool=active.slice();
    pool.sort((a,b)=>{
      const ha=(a.floors||[]).includes(r.floor)?0:1;
      const hb=(b.floors||[]).includes(r.floor)?0:1;
      if(ha!==hb) return ha-hb;
      const ra=target[a.id]?load[a.id]/target[a.id]:9;
      const rb=target[b.id]?load[b.id]/target[b.id]:9;
      if(Math.abs(ra-rb)>0.001) return ra-rb;
      return count[a.id]-count[b.id];
    });
    const c=pool[0];
    assign[r.no]=c.id; load[c.id]+=w; count[c.id]++;
  });

  // pasada de equilibrio (mueve habitaciones del más cargado al menos cargado)
  for(let it=0; it<260; it++){
    const arr=active.slice().sort((a,b)=>(load[b.id]/target[b.id])-(load[a.id]/target[a.id]));
    const hi=arr[0], lo=arr[arr.length-1];
    if(!hi||!lo||hi.id===lo.id) break;
    const diff=load[hi.id]/target[hi.id]-load[lo.id]/target[lo.id];
    if(diff<=0.34) break;
    // habitaciones de hi que puede coger lo
    const cands=rooms.filter(r=>assign[r.no]===hi.id).sort((a,b)=>{
      const wa=weight(day.status[a.no]), wb=weight(day.status[b.no]);
      const ha=(hi.floors||[]).includes(a.floor)?1:0, hb=(hi.floors||[]).includes(b.floor)?1:0;
      return ha-hb || wa-wb;
    });
    let moved=false;
    for(const r of cands){
      const w=weight(day.status[r.no]);
      if(load[hi.id]-w < 0) continue;
      const nHi=load[hi.id]-w, nLo=load[lo.id]+w;
      const before=Math.abs(load[hi.id]/target[hi.id]-load[lo.id]/target[lo.id]);
      const after=Math.abs(nHi/target[hi.id]-nLo/target[lo.id]);
      if(after<before-0.01){ assign[r.no]=lo.id; load[hi.id]=nHi; load[lo.id]=nLo; count[hi.id]--; count[lo.id]++; moved=true; break; }
    }
    if(!moved) break;
  }

  // guardar
  day.assign=assign;
  day.tasks={};
  rooms.forEach(r=>{
    const prev=null;
    day.tasks[r.no]={assignee:assign[r.no],status:'pending',rounds:[],obs:'',photos:[],check:null,u:Date.now()};
  });
  day.cfgU=Date.now();
  assignZones(day);
  (day.extras=day.extras||{});
  return {W,active,load,count,target};
}
function assignZones(day){
  const active=activeCleaners(day);
  const oldZones=day.zones||{};
  const doneZones={};
  Object.keys(oldZones).forEach(z=>{ if(oldZones[z].status==='done') doneZones[z]=oldZones[z]; });
  const counts={}; active.forEach(c=>counts[c.id]=0);
  const res={};
  S.cfg.zones.forEach(z=>{
    let who=z.owner;
    const ok=active.find(c=>c.id===who);
    if(!ok){
      const free=active.slice().sort((a,b)=>counts[a.id]-counts[b.id]);
      who=free[0]?free[0].id:null;
    }
    counts[who]=(counts[who]||0)+1;
    res[z.id]=doneZones[z.id]||{assignee:who,status:'pending',rounds:[],obs:'',photos:[],u:Date.now()};
    res[z.id].assignee=who;
  });
  day.zones=res;
  const ex=day.extras||{};
  S.cfg.extras.forEach(e=>{ if(!ex[e.id]) ex[e.id]={assignee:null,status:'none',rounds:[],u:Date.now()}; });
  day.extras=ex;
}
function seedExample(k){
  const d=ensureDay(k);
  const CO='8101,8103,8104,8109,8120,8306,8113,8121,8123,8124,8203,8204,8207,8216,8309,8310,8318,8119,8312'.split(',');
  const X='8106,8107,8108,8110,8307,8117,8313,8102,8122,8201,8205,8206,8208,8221,8215,8308,8301'.split(',');
  ROOMS.forEach(r=>d.status[r.no]='V');
  CO.forEach(n=>d.status[n]='CO'); X.forEach(n=>d.status[n]='X');
  d.assign={}; d.tasks={}; d.published=false; d.rest=[]; d.cfgU=Date.now();
  autoAssign(k); publishDay(k);
}
function publishDay(k){
  const day=ensureDay(k);
  if(!Object.keys(day.assign).length) autoAssign(k);
  day.published=true; day.cfgU=Date.now();
  logEv(day,null,'publish','','前台 ha publicado el reparto');
  sendNotice('今天的房间已发布，可以开始打扫。','Habitaciones de hoy publicadas.','all');
  save();
}

/* ---------------- acciones de tareas ---------------- */
function tObj(day,kind,key){
  if(kind==='room'){ return taskOf(day,key); }
  if(kind==='zone'){ return day.zones[key]; }
  return day.extras[key];
}
function startTask(k,kind,key,cid){
  const day=ensureDay(k); const t=tObj(day,kind,key); if(!t) return false;
  if(t.assignee && t.assignee!==cid && kind==='extra'){ /* extra: se queda quien la cogió */ }
  if(t.status==='done'){ toast('Ya está terminada · 已完成'); return false; }
  if(t.status==='doing'){ toast('Ya está en marcha · 已经开始'); return false; }
  if(kind!=='extra' && t.assignee!==cid){ toast('No es tu habitación · 不是你的房间'); return false; }
  t.status='doing'; t.assignee=cid; t.u=Date.now();
  t.rounds=t.rounds||[]; t.rounds.push({start:Date.now(),end:null,by:cid});
  logEv(day,cid,'start',kind+':'+key,'');
  save(); return true;
}
function finishTask(k,kind,key,cid){
  const day=ensureDay(k); const t=tObj(day,kind,key); if(!t) return false;
  if(t.status!=='doing'){ toast('Primero hay que empezar · 请先点开始'); return false; }
  const r=t.rounds[t.rounds.length-1]; if(r && !r.end) r.end=Date.now();
  t.status='done'; t.u=Date.now();
  logEv(day,cid,'done',kind+':'+key,'');
  save(); return true;
}
function reopenTask(k,kind,key,by){
  const day=ensureDay(k); const t=tObj(day,kind,key); if(!t) return;
  const r=t.rounds[t.rounds.length-1];
  if(r && !r.end) r.end=Date.now();
  if(r) r.void=true;
  t.status='pending'; t.check=null;

function workStartTs(k){ const [h,m]=S.cfg.workStart.split(':').map(Number); const d=parseKey(k); d.setHours(h,m,0,0); return d.getTime(); }
function workEndTs(k){ const [h,m]=S.cfg.workEnd.split(':').map(Number); const d=parseKey(k); d.setHours(h,m,0,0); return d.getTime(); }
function cleanerState(day,cid,now){
  const rooms=ROOMS.filter(r=>day&&day.assign[r.no]===cid&&['CO','X'].includes(day.status[r.no]));
  const done=rooms.filter(r=>day.tasks[r.no]&&day.tasks[r.no].status==='done');
  const doing=rooms.filter(r=>day.tasks[r.no]&&day.tasks[r.no].status==='doing');
  const wTotal=rooms.reduce((s,r)=>s+weight(day.status[r.no]),0);
  const wDone=done.reduce((s,r)=>s+weight(day.status[r.no]),0);
  const a=S.att[day?day.date:TODAY()]&&S.att[day?day.date:TODAY()][cid];
  const last=day?lastEvent(day,cid):null;
  const idle= last? Math.round((now-last)/60000) : (a&&a.in? Math.round((now-a.in)/60000):0);
  let act='off', actTxt='Sin entrar';
  if(a&&a.in){
    if(a.out){ act='done'; actTxt='Jornada cerrada '+hhmm(a.out); }
    else if(doing.length){ act='work'; actTxt='Trabajando en '+doing[0].no; }
    else if(last && idle<=S.cfg.idleWarn){ act='work'; actTxt='Activa (hace '+idle+' min)'; }
    else if(rooms.length && done.length===rooms.length){ act='done'; actTxt='Todo terminado'; }
    else if(idle>S.cfg.idleBad){ act='bad'; actTxt='Sin actividad '+idle+' min'; }
    else if(idle>S.cfg.idleWarn){ act='idle'; actTxt='Parada '+idle+' min'; }
    else { act='work'; actTxt='Activa'; }
  }
  return {rooms,done,doing,wTotal,wDone,att:a,idle,act,actTxt,last};
}

const cloud={on:false,url:'',key:'',timer:null,busy:false,fail:0,lastPull:0,lastPush:0,err:''};
function cloudConf(){
  const u=(S.cfg.cloud&&S.cfg.cloud.url||'').trim().replace(/\/$/,'');
  const k=(S.cfg.cloud&&S.cfg.cloud.key||'').trim();
  cloud.on=!!(u&&k); cloud.url=u; cloud.key=k;
}
function cHeaders(extra){
  return Object.assign({'apikey':cloud.key,'Authorization':'Bearer '+cloud.key,'Content-Type':'application/json'},extra||{});
}
async function cloudPull(){
  if(!cloud.on||cloud.busy) return null;
  cloud.busy=true;
  let rows=null;
  try{
    const r=await fetch(cloud.url+'/rest/v1/hne_limpieza?select=data,updated_at&id=eq.main',{headers:cHeaders()});
    if(!r.ok) throw new Error('pull '+r.status);
    rows=await r.json();
    if(rows&&rows[0]&&rows[0].data){ mergeRemote(rows[0].data); }
    cloud.fail=0; cloud.err=''; cloud.lastPull=Date.now();
  }catch(e){ cloud.fail++; cloud.err=String(e&&e.message?e.message:e); console.warn(e); }
  cloud.busy=false;
  return rows;
}
async function cloudPush(){
  if(!cloud.on||cloud.pushing) return;
  cloud.pushing=true;
  let failed=false;
  try{
    /* 1) leer lo ultimo y fusionar: asi no pisamos lo que acaba de hacer otra compañera */
    const r0=await fetch(cloud.url+'/rest/v1/hne_limpieza?select=data&id=eq.main',{headers:cHeaders()});
    if(r0.ok){
      const rows=await r0.json();
      if(rows&&rows[0]&&rows[0].data){ cloud.pushMerging=true; try{ mergeRemote(rows[0].data); }finally{ cloud.pushMerging=false; } }
    }
    /* 2) subir el estado ya fusionado */
    const body=JSON.stringify([{id:'main',data:S,updated_at:new Date().toISOString()}]);
    const r=await fetch(cloud.url+'/rest/v1/hne_limpieza?on_conflict=id',{
      method:'POST', headers:cHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}), body});
    if(!r.ok) throw new Error('push '+r.status);
    cloud.fail=0; cloud.err=''; cloud.lastPush=Date.now();
    clearTimeout(cloud.pushTimer); cloud.pushTimer=null;
  }catch(e){
    failed=true; cloud.fail++; cloud.err=String(e&&e.message?e.message:e); console.warn(e);
  }
  cloud.pushing=false;
  if(failed){ clearTimeout(cloud.pushTimer); cloud.pushTimer=setTimeout(()=>cloudPush(), 10000); }
}
function mergeRemote(rem){
  if(!rem) return;
  let changed=false;
  if((rem.cfgU||0)>(S.cfgU||0) && rem.cfg){ S.cfg=Object.assign(S.cfg,rem.cfg); S.cfgU=rem.cfgU; changed=true; }
  const days=rem.days||{};
  Object.keys(days).forEach(k=>{
    const L=S.days[k]; const R=days[k];
    if(!L){ S.days[k]=R; changed=true; return; }
    if((R.cfgU||0)>(L.cfgU||0)){
      L.status=R.status||L.status; L.assign=R.assign||L.assign; L.rest=R.rest||L.rest;
      L.published=R.published; L.cfgU=R.cfgU; changed=true;
    }
    if(!L.checks) L.checks={};
    if(R.checks) Object.keys(R.checks).forEach(no=>{ const a=L.checks[no], b=R.checks[no]; if(!a||((b.u||0)>(a.u||0))){ L.checks[no]=b; changed=true; } });
    ['tasks','zones','extras'].forEach(sec=>{
      const rs=R[sec]||{};
      L[sec]=L[sec]||{};
      Object.keys(rs).forEach(key=>{
        const a=L[sec][key], b=rs[key];
        if(!a || ((b.u||0)>(a.u||0))){ L[sec][key]=b; changed=true; }
      });
    });
    if(R.events&&R.events.length){
      const seen={}; const all=[];
      (L.events||[]).concat(R.events).forEach(e=>{ const key=e.t+'|'+e.cid+'|'+e.type+'|'+e.ref; if(!seen[key]){seen[key]=1;all.push(e);} });
      all.sort((a,b)=>a.t-b.t);
      if(all.length!==(L.events||[]).length){ L.events=all; changed=true; }
    }
  });
  const att=rem.att||{};
  Object.keys(att).forEach(k=>{
    S.att[k]=S.att[k]||{};
    Object.keys(att[k]).forEach(cid=>{
      const a=S.att[k][cid], b=att[k][cid];
      if(!a||((b.u||0)>(a.u||0))){ S.att[k][cid]=b; changed=true; }
    });
  });
  if((rem.pointsU||0)>(S.pointsU||0)&&rem.points){ S.points=rem.points; S.pointsU=rem.pointsU; changed=true; }
  const rn=rem.notices||[];
  if(rn.length){
    S.notices=S.notices||[];
    const idx={}; S.notices.forEach((n,i)=>idx[n.id]=i);
    rn.forEach(n=>{
      const i=idx[n.id];
      if(i===undefined){ S.notices.push(n); idx[n.id]=S.notices.length-1; changed=true; }
      else {
        const cur=S.notices[i];
        if((n.u||0)>(cur.u||0)){ S.notices[i]=n; changed=true; }
        else { const un=new Set(cur.read||[]); (n.read||[]).forEach(x=>un.add(x)); if(un.size!==(cur.read||[]).length){ cur.read=[...un]; changed=true; } }
      }
    });
    if(S.notices.length>150) S.notices=S.notices.slice(-150);
  }
  const rmsg=rem.msgs||[];
  if(rmsg.length){
    S.msgs=S.msgs||[];
    const mx={}; S.msgs.forEach(m=>mx[m.id]=m);
    rmsg.forEach(m=>{
      const cur=mx[m.id];
      if(!cur){ S.msgs.push(m); mx[m.id]=m; changed=true; }
      else { const un=new Set((cur.rd||[]).concat(m.rd||[])); if(un.size!==(cur.rd||[]).length){ cur.rd=[...un]; changed=true; } }
    });
    S.msgs.sort((a,b)=>a.at-b.at);
    if(S.msgs.length>400) S.msgs=S.msgs.slice(-400);
  }
  { const rids={}; rmsg.forEach(m=>rids[m.id]=1);
    if((S.msgs||[]).some(m=>!rids[m.id])) changed=true; }
  const rsos=rem.sos||[];
  if(rsos.length){
    S.sos=S.sos||[];
    const sx={}; S.sos.forEach(x=>sx[x.id]=x);
    rsos.forEach(x=>{
      const cur=sx[x.id];
      if(!cur){ S.sos.push(x); sx[x.id]=x; changed=true; }
      else if(x.ack&&!cur.ack){ cur.ack=x.ack; changed=true; }
    });
    S.sos.sort((a,b)=>a.at-b.at);
    if(S.sos.length>60) S.sos=S.sos.slice(-60);
  }
  { const sids={}; rsos.forEach(x=>sids[x.id]=1);
    if((S.sos||[]).some(x=>!sids[x.id])) changed=true; }
  if(changed) save();
}

let AC=null, sosTimer=null, sosMuteId=null, sosSig='';
function initAudio(){ try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); }catch(e){} }
function sosSound(on){
  if(!on){ if(sosTimer){ clearInterval(sosTimer); sosTimer=null; } try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){} return; }
  if(sosTimer) return;
  initAudio();
  const beep=()=>{
    if(!AC) return;
    try{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='square'; o.frequency.value=880; g.gain.value=0.07;
      o.connect(g); g.connect(AC.destination);
      const t=AC.currentTime; o.start(t);
      o.frequency.setValueAtTime(660,t+0.22); o.frequency.setValueAtTime(880,t+0.44);
      g.gain.setValueAtTime(0.07,t+0.60); g.gain.linearRampToValueAtTime(0.0001,t+0.72);
      o.stop(t+0.75);
    }catch(e){}
  };
  beep(); sosTimer=setInterval(beep,880);
  try{ if(navigator.vibrate) navigator.vibrate([350,160,350,160,350]); }catch(e){}
}
function activeSos(){ return (S.sos||[]).filter(x=>!x.ack).sort((a,b)=>b.at-a.at)[0]||null; }
function raiseSos(){

/* ================= REINICIAR · 重启 ================= */
function resumeTask(k,kind,key,mode){
  const day=ensureDay(k), t=tObj(day,kind,key);
  if(!t) return false;
  const rs=t.rounds||[];
  const last=rs[rs.length-1];
  if(mode==='now'){
    if(last&&!last.end) last.end=Date.now();
    if(last) last.void=true;
    rs.push({start:Date.now(),end:null,by:t.assignee||'admin',manual:true});
  } else {
    if(last&&last.start){ last.end=null; last.void=false; }
    else rs.push({start:Date.now(),end:null,by:t.assignee||'admin',manual:true});
  }
  t.rounds=rs; t.status='doing'; t.check=null; t.u=Date.now();
  logEv(day,null,'reopen',kind+':'+key,'reinicio '+(mode||'resume'));
  save(); return true;
}

let CHKREF=null;
function checkOf(day,no){ return (day&&day.checks)?day.checks[no]:null; }
function cleanedBy(day,no){
  const t=(day.tasks&&day.tasks[no])||{};
  const all=(t.rounds||[]).filter(x=>x.start);
  const valid=all.filter(x=>x.end&&!x.void);
  const rd=valid.length?valid:all;
  const last=rd[rd.length-1]||null;
  const c=cleaner((day.assign||{})[no])||cleaner(last?last.by:null);
  return {name:c?c.name:'—', cid:(day.assign||{})[no]||(last?last.by:null)||null, end:last?last.end:null, by:last?last.by:((day.assign||{})[no]||null)};
}
function revStats(k){
  const day=S.days[k]||{}, ch=day.checks||{}; const ids=Object.keys(ch).filter(n=>ch[n]&&(ch[n].ok===1||ch[n].ok===0));
  return {tot:ids.length, ok:ids.filter(n=>ch[n].ok===1).length, bad:ids.filter(n=>ch[n].ok===0).length, q:ids.filter(n=>ch[n].kind==='queja').length};
}
function cleanerRev(k,cid){
  const day=S.days[k]||{}, ch=day.checks||{}; let tot=0,ok=0;
  Object.keys(ch).forEach(no=>{ const x=ch[no]; if(!x||(x.ok!==1&&x.ok!==0)) return; if(((day.assign||{})[no])===cid){ tot++; if(x.ok===1) ok++; } });
  return {tot:tot,ok:ok,bad:tot-ok};
}

  return h;

let TT={kind:'room',key:null};
function tsOf(k,t){
  if(!t) return null;
  const [h,m]=String(t).split(':').map(Number);
  if(isNaN(h)||isNaN(m)) return null;
  const d=parseKey(k); d.setHours(h,m,0,0); return d.getTime();
}
function hmOf(ts){ if(!ts) return ''; const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function openTimes(kind,key){
  const k=UI.sessionAdminDate(), day=ensureDay(k);

  let h='<div class="sheet-h"><h3>⏱ Horas a mano · 手动时间</h3><button class="x" data-act="close">✕</button></div>';

    h+='<div class="tt-row"><span class="tt-lb">Entrada</span><input type="time" id="tt_in" value="'+(a.in?hmOf(a.in):'')+'"></div>';
    h+='<div class="tt-row"><span class="tt-lb">Salida</span><input type="time" id="tt_out" value="'+(a.out?hmOf(a.out):'')+'"></div>';
    h+='<button class="btn btn-primary btn-block" data-act="saveatt" data-k="'+key+'">Guardar entrada / salida · 保存打卡</button>';
    h+='<div class="sec-title" style="margin:16px 0 6px">Sus habitaciones</div><div class="tw" style="border:none"><table style="min-width:0"><thead><tr><th>Hab.</th><th>Inicio</th><th>Fin</th><th></th></tr></thead><tbody>';
    ROOMS.filter(r=>day.assign[r.no]===key).forEach(r=>{
      const t=taskOf(day,r.no), rd=(t.rounds||[]).filter(x=>x.start&&!x.void);
      const f=rd[0], l=rd[rd.length-1];
      h+='<tr><td><b>'+r.no+'</b></td><td class="mono">'+(f?hhmm(f.start):'—')+'</td><td class="mono">'+(l&&l.end?hhmm(l.end):'—')+'</td>'+
        '<td style="text-align:right"><button class="btn btn-sm btn-ghost" data-act="ttroom" data-k="'+r.no+'">⏱</button></td></tr>';

  if(!(t.rounds||[]).length) h+='<div style="font-size:13px;color:#7b8aa5;margin-bottom:6px">Sin tiempos todavía: escribe la hora de inicio y de fin. · 还没有时间，直接填开始和结束。</div>';

  });
  h+='<div class="btnrow" style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-act="ttadd">+ Ronda · 加一段</button>'+
     '<button class="btn btn-primary btn-sm" data-act="savetimes">Guardar horas · 保存</button></div>';
  h+='<div class="note" style="margin-top:12px">Si alguien pulsó FIN sin querer: escribe la hora de inicio que tenía y guarda, o pulsa <b>Reabrir y seguir</b>. No se borra nada. · 按错结束：改回开始时间即可，记录不会丢。</div>';
  h+='<div class="btnrow" style="margin-top:8px"><button class="btn btn-gold" data-act="ttreopen">Reabrir y seguir · 继续计时</button>'+

function saveTimes(){
  const k=UI.sessionAdminDate(), day=ensureDay(k), t=tObj(day,TT.kind,TT.key);
  if(!t) return;
  const ins=Array.from(document.querySelectorAll('.tt-in'));
  const ends=Array.from(document.querySelectorAll('.tt-end'));
  const out=[];
  for(let i=0;i<ins.length;i++){
    const st=tsOf(k,ins[i].value), en=tsOf(k,ends[i]?ends[i].value:'');
    if(!st&&!en) continue;
    if(st&&en&&en<=st){ toast('El fin es antes del inicio · 结束时间不对'); return; }
    const old=(t.rounds||[])[i]||{};
    out.push({start:st,end:en,by:old.by||t.assignee||'admin',void:old.void||false,manual:true});
  }
  t.rounds=out; t.u=Date.now();
  const last=out[out.length-1];
  if(last&&last.start&&!last.end) t.status='doing';
  else if(last&&last.end) t.status='done';
  logEv(day,null,'edit',TT.kind+':'+TT.key,'horas corregidas a mano');
  save(); closeModal(); render(); toast('Horas guardadas ✓ · 已保存');
}

function pointsOf(cid){
  let p=0;
  Object.values(S.days).forEach(d=>{
    Object.keys(d.extras||{}).forEach(eid=>{
      const t=d.extras[eid];
      if(t.status==='done'&&t.assignee===cid){ const c=S.cfg.extras.find(x=>x.id===eid); if(c) p+=c.pts; }
    });
  });
  return p;
}

/* ---------- planificar ---------- */
function adminPlan(k,day){
  const d=ensureDay(k);
  const counts={V:0,CO:0,X:0,OOO:0};
  ROOMS.forEach(r=>{counts[d.status[r.no]]=(counts[d.status[r.no]]||0)+1});
  let h='';
  h+='<div class="card"><div class="card-h"><h3>1 · '+T('¿Quién descansa hoy?','今天谁休息？')+'</h3><span class="sub">休息天</span></div><div style="display:flex;flex-wrap:wrap;gap:8px">'+
    S.cfg.cleaners.filter(c=>c.active).map(c=>{
      const on=(d.rest||[]).includes(c.id);
      return '<button class="btn btn-sm '+(on?'btn-danger':'btn-ghost')+'" data-act="rest" data-k="'+c.id+'" style="'+(on?'background:#fdecec;border-color:#f0b6b6;':'')+'">'+
        (on?'✕ ':'')+esc(c.name)+'</button>';
    }).join('')+
    '<button class="btn btn-sm btn-ghost" data-act="restnone">'+T('Nadie descansa','没人休息')+'</button></div>'+
    '<div style="font-size:12px;color:#7b8aa5;margin-top:8px">Si alguien descansa, sus habitaciones se reparten solas entre las demás y sus zonas comunes también.</div></div>';

  h+='<div class="card"><div class="card-h"><h3>2 · CO / X / '+T('Vacío','空房')+'</h3><span class="sub">'+T('Toca la habitación para cambiar','点房间切换状态')+'</span></div>'+
    '<div class="btnrow" style="margin-bottom:10px">'+
      '<button class="btn btn-sm btn-ghost" data-act="allvacio">'+T('Todo vacío','全部空房')+'</button>'+
      '<button class="btn btn-sm btn-ghost" data-act="copyprev">'+T('Copiar día anterior','复制前一天')+'</button>'+
      '<span class="pill" style="background:#eaf0ff;color:#1d4ed8">CO '+counts.CO+'</span>'+
      '<span class="pill" style="background:#fff4e2;color:#b45309">X '+counts.X+'</span>'+
      '<span class="pill">'+T('Vacío','空房')+' '+counts.V+'</span>'+
    '</div>'+
    '<div class="legend"><span><i style="background:#f7f9fc"></i>Vacío (no se limpia)</span><span><i style="background:#eaf0ff"></i>CO 退房</span>'+
    '<span><i style="background:#fff6e6"></i>X 续房 (=½ CO)</span><span><i style="background:#3c4658"></i>Fuera de servicio</span></div>';
  [1,2,3].forEach(f=>{
    h+='<div style="margin-top:12px"><div class="floor-h" style="margin:0 0 7px"><span class="f">PLANTA '+f+'</span><span class="l"></span>'+
      '<span style="font-size:11.5px;color:#7b8aa5">'+ROOMS.filter(r=>r.floor===f).length+' hab.</span></div><div class="chips">';
    ROOMS.filter(r=>r.floor===f).forEach(r=>{
      const st=d.status[r.no]; const as=day&&d.assign[r.no]?cleaner(d.assign[r.no]):null;
      const tk=d.tasks[r.no];
      h+='<div class="rchip '+st.toLowerCase()+(tk&&tk.status==='done'?' done':tk&&tk.status==='doing'?' doing':'')+'" data-act="cyclestatus" data-k="'+r.no+'">'+
        '<div class="n">'+r.no+'</div><div class="t">'+TYPES[r.type].s+'</div>'+
        (as? '<div class="as" style="color:'+as.color+'">'+esc(as.name)+'</div>':'')+'</div>';
    });
    h+='</div></div>';
  });
  h+='</div>';

  // reparto
  const active=activeCleaners(d);
  const W=ROOMS.filter(r=>['CO','X'].includes(d.status[r.no])).reduce((s,r)=>s+weight(d.status[r.no]),0);
  const load={},cnt={};
  active.forEach(c=>{load[c.id]=0;cnt[c.id]=0});
  ROOMS.forEach(r=>{ if(d.assign[r.no]&&load[d.assign[r.no]]!==undefined){ load[d.assign[r.no]]+=weight(d.status[r.no]); cnt[d.assign[r.no]]++; }});
  const F=active.reduce((s,c)=>s+(c.factor||1),0)||1;
  h+='<div class="card"><div class="card-h"><h3>3 · '+T('Reparto automático','自动分配')+'</h3><span class="sub">'+W.toFixed(1)+' puntos de trabajo</span></div>';
  h+='<div class="tw" style="border:none"><table class="tt" style="min-width:0"><thead><tr><th>'+T('Empleada','员工')+'</th><th>Hab</th><th>Pts</th><th>'+T('Objetivo','目标')+'</th><th></th></tr></thead><tbody>';
  active.forEach(c=>{
    const tg=W*(c.factor||1)/F;
    h+='<tr><td><b style="color:'+c.color+'">'+esc(c.name)+'</b> <span style="color:#93a0b6;font-size:11px">×'+c.factor+'</span></td>'+
      '<td class="mono">'+cnt[c.id]+'</td><td class="mono"><b>'+load[c.id].toFixed(1)+'</b></td>'+
      '<td class="mono" style="color:#7b8aa5">'+tg.toFixed(1)+'</td>'+
      '<td>'+(Math.abs(load[c.id]-tg)<=0.01?'<span class="badge b-ok">OK</span>':load[c.id]?'<span class="badge b-x">'+((load[c.id]-tg)>0?'+':'')+(load[c.id]-tg).toFixed(1)+'</span>':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="btnrow" style="margin-top:12px">'+
     '<button class="btn btn-primary" data-act="autassign">⚙️ '+T('Repartir automático','自动分配')+'</button>'+
     '<button class="btn '+(d.published?'btn-ghost':'btn-gold')+'" data-act="publish">'+(d.published?T('✓ Publicado (republicar)','✓ 已发布（重新发布）'):T('📢 Publicar a las empleadas','📢 发布给员工'))+'</button>'+
     '</div>';
  h+='<div class="note" style="margin-top:10px">Reparto: prioridad por planta (1ª→陈, 2ª→曹, 石 1ª+2ª, 3ª→Liquan) y <b>Liquan siempre la mitad de carga</b>. Si alguien descansa, se reparte entre las que están. 2 habitaciones X = 1 CO.</div>';
  h+='</div>';
  return h;
}

    st.rooms.forEach(r=>{const t=day.tasks[r.no]; if(t) ms+=t.rounds.filter(x=>x.start&&x.end&&!x.void).reduce((s,x)=>s+(x.end-x.start),0)});
    Object.values(day.zones||{}).forEach(z=>{ if(z.assignee===c.id&&z.rounds) ms+=z.rounds.filter(x=>x.start&&x.end&&!x.void).reduce((s,x)=>s+(x.end-x.start),0); });
    Object.values(day.extras||{}).forEach(x=>{ if(x.assignee===c.id&&x.rounds) ms+=x.rounds.filter(y=>y.start&&y.end&&!y.void).reduce((s,y)=>s+(y.end-y.start),0); });
    const jorn=a&&a.in?((a.out||now)-a.in):0;

/* ---------- generador XLSX (sin librerías) ---------- */
const CRC_T=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function _crc(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function _zip(files){
  const enc=new TextEncoder(); const parts=[]; const cen=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255]; const u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const nm=enc.encode(f.name); const data=(typeof f.data==='string')?enc.encode(f.data):f.data;
    const crc=_crc(data);
    const lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,data);
    cen.push({nm,crc,len:data.length,off});
    off+=lh.length+nm.length+data.length;
  });
  const cd=[]; let cdsize=0;
  cen.forEach(c=>{

function compressImg(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=900; let w=img.width,h=img.height;
      if(w>=h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>w&&h>max){w=Math.round(w*max/h);h=max;}
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.6));
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function b64enc(o){ try{ return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }catch(e){ return ''; } }
function b64dec(s){
  try{ return JSON.parse(atob(s)); }catch(e){}
  try{ const t=String(s).replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(atob(t)); }catch(e){}
  try{ const t=String(s).replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(t)))); }catch(e){}
  return null;
}
function parseTeamLink(txt){
  txt=String(txt||'').trim(); if(!txt) return null;
  let m=txt.match(/[?&]c=([^&\s]+)/);
  const cands=[]; if(m) cands.push(m[1]); cands.push(txt);
  for(let i=0;i<cands.length;i++){ const o=b64dec(cands[i]); if(o&&o.u&&o.k) return o; }
  return null;
}
/* si el enlace trae la configuración (?c=...), la app queda conectada sola */
function applyLinkConf(){
  try{
    const c=new URLSearchParams(location.search).get('c'); if(!c) return;
    const o=b64dec(c); if(!o||!o.u||!o.k) return;
    if((S.cfg.cloud&&S.cfg.cloud.url)!==o.u || (S.cfg.cloud&&S.cfg.cloud.key)!==o.k){
      S.cfg.cloud={url:o.u,key:o.k}; S.cfgU=Date.now();
      try{ localStorage.setItem(LSKEY,JSON.stringify(S)); }catch(e){}
    }
  }catch(e){}
}
function teamLink(){
  const base=location.origin+location.pathname;
  return base+(base.indexOf('?')>=0?'&':'?')+'c='+b64enc({u:S.cfg.cloud.url,k:S.cfg.cloud.key});
}

    document.body.appendChild(d);
    document.getElementById('fatalRst').onclick=()=>{
      try{ const raw=localStorage.getItem(LSKEY); if(raw) localStorage.setItem(LSKEY+'_copia_'+Date.now(),raw); localStorage.removeItem(LSKEY); }catch(e){}
      location.reload();
    };
  }catch(e){ try{ document.body.innerHTML='<pre style="padding:18px;white-space:pre-wrap;font:12px monospace">'+esc(String(msg))+'</pre>'; }catch(_){} }
}
window.addEventListener('error',e=>fatal(e.message||'Error'));
applyLinkConf();
cloudConf();
checkBadge();
try{ render(); }catch(e){ fatal(e&&e.message?e.message:e); }
cloudStart();
setInterval(tick,1000);
setInterval(()=>{ if(document.visibilityState==='visible') renderIfIdle(); },20000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ cloudPull().then(()=>render()); } });
window.addEventListener('beforeunload',()=>{ try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){} });
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
